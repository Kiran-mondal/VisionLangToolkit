<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background: Clean Crisp White -->
  <rect width="512" height="512" rx="112" fill="#FFFFFF"/>

  <!-- Subtle inner container / border for professional SaaS emblem look -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#F1F5F9" stroke-width="4"/>

  <!-- Group: Outer Aperture / Camera Lens Body -->
  <g transform="translate(256, 256)">
    <!-- Outer Lens Ring (Dark Slate Gray) -->
    <circle cx="0" cy="0" r="192" fill="#1E293B"/>

    <!-- Subtle Mechanical Lens Groove -->
    <circle cx="0" cy="0" r="180" fill="none" stroke="#334155" stroke-width="3"/>

    <!-- Primary Accent Vibrant Blue Ring -->
    <circle cx="0" cy="0" r="162" fill="none" stroke="#004ac6" stroke-width="14"/>

    <!-- Camera Lens Aperture Blades (Dark Slate & Deep Indigo Shades) -->
    <!-- Blade 1 -->
    <path d="M 0 -155 L 110 -110 L 45 -45 Z" fill="#0F172A" opacity="0.95"/>
    <path d="M 0 -155 L 110 -110" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>

    <!-- Blade 2 -->
    <path d="M 155 0 L 110 110 L 45 45 Z" fill="#1E293B" opacity="0.95"/>
    <path d="M 155 0 L 110 110" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>

    <!-- Blade 3 -->
    <path d="M 0 155 L -110 110 L -45 45 Z" fill="#0F172A" opacity="0.95"/>
    <path d="M 0 155 L -110 110" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>

    <!-- Blade 4 -->
    <path d="M -155 0 L -110 -110 L -45 -45 Z" fill="#1E293B" opacity="0.95"/>
    <path d="M -155 0 L -110 -110" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>

    <!-- Aperture Opening - Inner Lens Core (Clean White / Vibrant Center) -->
    <circle cx="0" cy="0" r="118" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="118" fill="none" stroke="#004ac6" stroke-width="6"/>

    <!-- Subtle Optical Reflection Arc -->
    <path d="M -75 -40 A 85 85 0 0 1 40 -75" fill="none" stroke="#E2E8F0" stroke-width="7" stroke-linecap="round"/>

    <!-- Coding Terminal Bracket '>_' Integration (Language & API) -->
    <!-- Bracket '>' rendered in Vibrant Primary Blue (#004ac6) -->
    <path d="M -44 -48 L 8 0 L -44 48" fill="none" stroke="#004ac6" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Terminal Cursor '_' in Dark Slate Gray (#1E293B) with rounded geometry -->
    <line x1="20" y1="48" x2="52" y2="48" stroke="#1E293B" stroke-width="22" stroke-linecap="round"/>
  </g>
</svg>
